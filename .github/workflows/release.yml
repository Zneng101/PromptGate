name: Release

# 打 tag v* 时自动构建多平台二进制并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build frontend
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Build binaries (cross-platform)
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          mkdir -p dist
          targets="linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64"
          for target in $targets; do
            os=${target%-*}
            arch=${target#*-}
            echo "::group::Build $os/$arch"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o dist/promptgate-$target$ext ./cmd/promptgate
            echo "::endgroup::"
          done

      - name: Package archives
        run: |
          cd dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            tar -czf promptgate-$target.tar.gz promptgate-$target
            rm -f promptgate-$target
          done
          for target in windows-amd64; do
            zip -q promptgate-$target.zip promptgate-$target.exe
            rm -f promptgate-$target.exe
          done
          ls -lh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
